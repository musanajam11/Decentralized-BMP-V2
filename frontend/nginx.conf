map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Resolve `backend` lazily so nginx still starts when the backend container
# is briefly unavailable (e.g. during a redeploy).
resolver 127.0.0.11 ipv6=off valid=30s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 256m;

  # Proxy all FastAPI backend endpoints to the backend container.
  # Without this, the BeamMP-Server's `POST /heartbeat` (and any other
  # non-GET API request) lands on the static-file `try_files` block
  # below and gets a 405 from nginx itself, which the server then
  # reports as "Backend failed to respond to a heartbeat".
  #
  # Notes on the regex shape:
  # - `^/+` tolerates any leading-slash runs defensively. The current
  #   source-built binaries (see patches/ and the build-binaries CI
  #   workflow) emit clean paths, but earlier hex-patched releases
  #   produced slash-padded request lines; keep the tolerance.
  # - `v/s/heartbeat` is the heartbeat path used by BeamMP-Server v3.9+
  #   (the launcher still uses the bare `/heartbeat`); both must route.
  # - `v/s` (no trailing path) is the version-string probe.
  location ~* ^/+(v/s/heartbeat|v/s|heartbeat|servers/heartbeat|servers-info|userlogin|pkToUser|version|version/.*|sha/.*|builds/.*|docs|openapi\.json|api/.*|admin/.*|auth/.*|oauth/.*|invites/.*|keys/?.*|publish/.*|beammp/.*) {
    set $backend_upstream "http://backend:8420";
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Hashed assets are immutable — cache them aggressively.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NEVER be cached — it points at hashed asset filenames
  # that change on every rebuild. Without this, browsers will keep serving
  # an old SPA shell and miss new features (e.g. the Background Wallpaper
  # admin panel) until the user manually hard-reloads.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  # SPA: anything else falls back to index.html for client-side routing.
  # Same no-cache headers apply because this serves index.html too.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
    try_files $uri /index.html;
  }
}
